<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Orders | VJ Mobiles Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #020d1f; color: #fff; min-height: 100vh; display: flex; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 240px; min-height: 100vh; background: #031428;
      border-right: 1px solid rgba(255,255,255,0.07);
      display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100%;
    }
    .sidebar-logo {
      padding: 22px 20px; border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; gap: 12px;
    }
    .sidebar-logo img { width: 46px; height: 46px; border-radius: 50%; background: #fff; }
    .sidebar-logo span { font-size: 16px; font-weight: bold; color: #6ddd00; }
    .sidebar nav { padding: 18px 0; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 13px;
      padding: 13px 22px; color: #c5d0dd; text-decoration: none;
      font-size: 14px; transition: 0.2s;
    }
    .nav-item:hover, .nav-item.active { background: rgba(100,255,0,0.08); color: #7fff00; border-left: 3px solid #7fff00; }
    .nav-item i { width: 18px; text-align: center; }
    .sidebar-footer { padding: 18px 22px; border-top: 1px solid rgba(255,255,255,0.07); }
    .logout-btn {
      display: flex; align-items: center; gap: 10px;
      background: none; border: 1px solid rgba(255,80,80,0.4);
      color: #ff6b6b; padding: 10px 16px; border-radius: 7px;
      cursor: pointer; font-size: 13px; width: 100%; transition: 0.2s;
    }
    .logout-btn:hover { background: rgba(255,80,80,0.1); }

    /* ── MAIN ── */
    .main { margin-left: 240px; flex: 1; padding: 28px 32px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .topbar h1 { font-size: 22px; }
    .topbar h1 span { color: #6ddd00; }

    /* ── FILTERS ── */
    .filters {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .search-box {
      flex: 1; min-width: 220px; display: flex;
      background: #041b36; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; overflow: hidden;
    }
    .search-box input {
      flex: 1; background: none; border: none; color: #fff;
      padding: 10px 14px; font-size: 14px; outline: none;
    }
    .search-box input::placeholder { color: #5a7a9a; }
    .search-box button {
      background: #6ddd00; border: none; color: #021225;
      padding: 0 16px; cursor: pointer; font-size: 15px;
    }
    .filter-select {
      background: #041b36; border: 1px solid rgba(255,255,255,0.1);
      color: #fff; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; cursor: pointer; outline: none;
    }
    .filter-select option { background: #031428; }

    /* ── STAT PILLS ── */
    .stat-pills { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .pill {
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold;
      border: 1px solid; cursor: pointer; transition: 0.2s;
    }
    .pill.all      { border-color: #7fa0c0; color: #7fa0c0; }
    .pill.placed   { border-color: #3ab4ff; color: #3ab4ff; }
    .pill.approved { border-color: #6ddd00; color: #6ddd00; }
    .pill.packed   { border-color: #ffc800; color: #ffc800; }
    .pill.shipped  { border-color: #c080ff; color: #c080ff; }
    .pill.delivery { border-color: #ff9f00; color: #ff9f00; }
    .pill.delivered{ border-color: #00dc50; color: #00dc50; }
    .pill.cancelled{ border-color: #ff6b6b; color: #ff6b6b; }
    .pill.active   { background: rgba(255,255,255,0.08); }

    /* ── TABLE ── */
    .table-wrap {
      background: #041b36; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 12px 14px;
      background: rgba(255,255,255,0.04); color: #7fa0c0;
      font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.07);
      white-space: nowrap;
    }
    td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #cdd8e4; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── BADGE ── */
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .badge-placed    { background: rgba(0,150,255,0.15);  color: #3ab4ff; }
    .badge-approved  { background: rgba(100,255,0,0.15);  color: #6ddd00; }
    .badge-packed    { background: rgba(255,200,0,0.15);  color: #ffc800; }
    .badge-shipped   { background: rgba(150,80,255,0.15); color: #c080ff; }
    .badge-delivery  { background: rgba(255,160,0,0.15);  color: #ff9f00; }
    .badge-delivered { background: rgba(0,220,80,0.15);   color: #00dc50; }
    .badge-cancelled { background: rgba(255,80,80,0.15);  color: #ff6b6b; }

    /* ── STATUS DROPDOWN ── */
    .status-select {
      background: #031428; border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 5px 10px; border-radius: 6px;
      font-size: 12px; cursor: pointer; outline: none;
    }
    .status-select:focus { border-color: #6ddd00; }

    /* ── EMPTY ── */
    .empty { text-align: center; color: #5a7a9a; padding: 30px; font-size: 14px; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 25px; right: 25px;
      padding: 12px 20px; background: #041b36;
      border-left: 4px solid #6ddd00; border-radius: 8px;
      font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transform: translateX(400px); transition: 0.4s; z-index: 9999;
    }
    .toast.show { transform: translateX(0); }
    .toast.error { border-left-color: #ff6b6b; }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 20px 16px; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="../logo.png" alt="VJ Mobiles" />
    <span>VJ MOBILES</span>
  </div>
  <nav>
    <a href="dashboard.html" class="nav-item">
      <i class="fa-solid fa-gauge"></i> Dashboard
    </a>
    <a href="orders.html" class="nav-item active">
      <i class="fa-solid fa-bag-shopping"></i> Orders
    </a>
    <a href="bookings.html" class="nav-item">
      <i class="fa-solid fa-screwdriver-wrench"></i> Service Bookings
    </a>
    <a href="../index.html" class="nav-item">
      <i class="fa-solid fa-globe"></i> View Website
    </a>
  </nav>
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="handleLogout()">
      <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>
  </div>
</aside>


<!-- MAIN -->
<main class="main">

  <div class="topbar">
    <h1>Manage <span>Orders</span></h1>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by name, mobile or order ID…" />
      <button onclick="doSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </div>

  <!-- STATUS PILLS -->
  <div class="stat-pills">
    <span class="pill all active"    onclick="filterByStatus('')">All</span>
    <span class="pill placed"        onclick="filterByStatus('Order Placed')">Order Placed</span>
    <span class="pill approved"      onclick="filterByStatus('Admin Approved')">Approved</span>
    <span class="pill packed"        onclick="filterByStatus('Order Packed')">Packed</span>
    <span class="pill shipped"       onclick="filterByStatus('Shipped')">Shipped</span>
    <span class="pill delivery"      onclick="filterByStatus('Out for Delivery')">Out for Delivery</span>
    <span class="pill delivered"     onclick="filterByStatus('Delivered')">Delivered</span>
    <span class="pill cancelled"     onclick="filterByStatus('Cancelled')">Cancelled</span>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Mobile</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Status</th>
          <th>Update</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="9" class="empty">Loading orders…</td></tr>
      </tbody>
    </table>
  </div>

</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>


<script type="module">
  import { requireAdmin, adminLogout } from "../backend/auth/adminAuth.js";
  import { getAllOrders, updateOrderStatus, searchOrders, getOrdersByStatus } from "../backend/admin/adminOrders.js";

  requireAdmin();

  const ORDER_STATUSES = [
    "Order Placed", "Admin Approved", "Order Packed",
    "Shipped", "Out for Delivery", "Delivered", "Cancelled",
  ];

  let allOrders = [];

  function badgeClass(status) {
    const map = {
      "Order Placed":      "badge-placed",
      "Admin Approved":    "badge-approved",
      "Order Packed":      "badge-packed",
      "Shipped":           "badge-shipped",
      "Out for Delivery":  "badge-delivery",
      "Delivered":         "badge-delivered",
      "Cancelled":         "badge-cancelled",
    };
    return map[status] || "badge-placed";
  }

  function formatDate(ts) {
    if (!ts) return "—";
    return new Date(ts).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
  }

  function renderTable(orders) {
    const tbody = document.getElementById("ordersBody");
    if (!orders || orders.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" class="empty">No orders found.</td></tr>`;
      return;
    }
    tbody.innerHTML = orders.map((o) => `
      <tr id="row-${o.order_id}">
        <td><b>${o.order_id}</b></td>
        <td>${o.full_name}</td>
        <td>${o.mobile}</td>
        <td>${o.product_name}</td>
        <td>${o.quantity}</td>
        <td>₹${o.total_amount?.toLocaleString("en-IN")}</td>
        <td>${formatDate(o.created_at)}</td>
        <td><span class="badge ${badgeClass(o.status)}">${o.status}</span></td>
        <td>
          <select class="status-select" onchange="changeStatus('${o.order_id}', this.value)">
            ${ORDER_STATUSES.map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
          </select>
        </td>
      </tr>
    `).join("");
  }

  async function loadOrders() {
    const result = await getAllOrders();
    if (result.success) {
      allOrders = result.data;
      renderTable(allOrders);
    } else {
      document.getElementById("ordersBody").innerHTML =
        `<tr><td colspan="9" class="empty">Error loading orders.</td></tr>`;
    }
  }

  // Status filter pills
  window.filterByStatus = async function (status) {
    document.querySelectorAll(".pill").forEach((p) => p.classList.remove("active"));
    event.target.classList.add("active");

    if (!status) {
      renderTable(allOrders);
    } else {
      const filtered = allOrders.filter((o) => o.status === status);
      renderTable(filtered);
    }
  };

  // Search
  window.doSearch = async function () {
    const q = document.getElementById("searchInput").value.trim();
    if (!q) { renderTable(allOrders); return; }
    const result = await searchOrders(q);
    if (result.success) renderTable(result.data);
  };

  document.getElementById("searchInput").addEventListener("keyup", (e) => {
    if (e.key === "Enter") window.doSearch();
  });

  // Update status
  window.changeStatus = async function (orderId, newStatus) {
    const result = await updateOrderStatus(orderId, newStatus);
    showToast(
      result.success ? `✓ ${orderId} → ${newStatus}` : "Error: " + result.message,
      result.success ? "" : "error"
    );
    if (result.success) {
      // Update local data
      const idx = allOrders.findIndex((o) => o.order_id === orderId);
      if (idx !== -1) allOrders[idx].status = newStatus;
    }
  };

  // Toast
  function showToast(msg, type = "") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (type ? " " + type : "");
    setTimeout(() => t.classList.remove("show"), 3000);
  }

  window.handleLogout = function () { adminLogout(); };

  loadOrders();
</script>

</body>
</html>
