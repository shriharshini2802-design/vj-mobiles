<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    background-image: url(ground.jpg);
}

header{
    background:#2c2302;
    padding:15px 30px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:gold;
    font-size:28px;
    font-weight: bold;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
    font-weight: 600;
}

nav ul li a{
    text-decoration:none;
    color:white;
}

.title{
    text-align:center;
    padding:60px 0 30px;
}

.title h1{
    font-size:40px;
    color:#c0c6d3;
}

.title p{
    color:#666;
    margin-top:10px;
}

.gallery{

    width:90%;
    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));

    gap:20px;

    padding-bottom:60px;

}

.gallery img{

    width:100%;
    height:250px;

    object-fit:cover;

    border-radius:10px;

    transition:0.4s;

}

.gallery img:hover{

    transform:scale(1.05);

}

footer{

    background:#2c2302;

    color:white;

    text-align:center;

    padding:20px;

}
