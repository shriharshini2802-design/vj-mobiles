<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Service | VJ Mobiles</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        /* =========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family: "Poppins", sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #01091a,
                    #031b38,
                    #020d20
                );

            color: white;

            min-height: 100vh;

            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }


        /* =========================================
           BACKGROUND
        ========================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: -2;

            background:

                radial-gradient(
                    circle at 20% 30%,
                    rgba(0, 120, 255, 0.14),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 70%,
                    rgba(50, 255, 0, 0.10),
                    transparent 30%
                );
        }

        body::after {

            content: "";

            position: fixed;

            inset: 0;

            z-index: -1;

            opacity: 0.20;

            background-image:

                linear-gradient(
                    rgba(0, 150, 255, 0.08) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0, 150, 255, 0.08) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;
        }


        /* =========================================
           NAVBAR
        ========================================== */

        header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 85px;

            z-index: 1000;

            background:
                rgba(1, 10, 28, 0.96);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid
                rgba(150, 255, 0, 0.45);
        }

        .navbar {

            width: 94%;

            max-width: 1400px;

            height: 100%;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        /* =========================================
           LOGO
        ========================================== */

        .logo {

            width: 105px;
            height: 105px;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            top: 12px;

            z-index: 10;
        }

        .logo img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            border-radius: 50%;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(0, 255, 100, 0.25)
                );
        }


        /* =========================================
           NAV LINKS
        ========================================== */

        .nav-links {

            display: flex;

            align-items: center;

            gap: 42px;

            margin-left: 50px;
        }

        .nav-links a {

            position: relative;

            color: white;

            font-size: 16px;

            font-weight: 500;

            transition: 0.3s;
        }

        .nav-links a:hover {

            color: #8cff00;
        }

        .nav-links a.active {

            color: white;
        }

        .nav-links a.active::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -12px;

            width: 100%;

            height: 3px;

            border-radius: 5px;

            background: #8cff00;

            box-shadow:
                0 0 8px
                rgba(140, 255, 0, 0.7);
        }


        /* =========================================
           ADMIN BUTTON
        ========================================== */

        .admin-btn {

            border: none;

            padding:
                13px 24px;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #12a800,
                    #40d900
                );

            color: white;

            font-family: inherit;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .admin-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(30, 255, 0, 0.25);
        }


        /* =========================================
           MOBILE MENU
        ========================================== */

        .menu-btn {

            display: none;

            font-size: 25px;

            cursor: pointer;
        }


        /* =========================================
           MAIN
        ========================================== */

        .booking-section {

            width: 94%;

            max-width: 1400px;

            margin: auto;

            padding-top: 125px;

            padding-bottom: 50px;
        }


        /* =========================================
           BOOKING TITLE
        ========================================== */

        .booking-title {

            margin-bottom: 30px;
        }

        .booking-title h1 {

            font-size:
                clamp(34px, 4vw, 48px);

            font-weight: 800;

            color: #ffd84d;

            letter-spacing: 1px;

            text-shadow:
                0 0 12px
                rgba(255, 210, 50, 0.12);
        }

        .booking-title p {

            margin-top: 3px;

            color: #d7dce5;

            font-size: 17px;
        }


        /* =========================================
           MAIN LAYOUT
        ========================================== */

        .booking-layout {

            display: grid;

            grid-template-columns:
                1.1fr
                0.9fr;

            gap: 55px;

            align-items: start;
        }


        /* =========================================
           FORM
        ========================================== */

        .booking-form {

            width: 100%;
        }

        .form-row {

            display: grid;

            grid-template-columns:
                220px
                1fr;

            align-items: center;

            margin-bottom: 10px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.05);

            padding-bottom: 5px;
        }

        .form-row label {

            font-size: 15px;

            font-weight: 600;

            color: #f1f3f6;
        }

        .form-row input,
        .form-row select,
        .form-row textarea {

            width: 100%;

            background:
                rgba(39, 67, 101, 0.85);

            border:
                1px solid
                rgba(120, 160, 205, 0.20);

            border-radius: 7px;

            color: white;

            padding:
                11px 14px;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            transition: 0.3s;
        }

        .form-row input:focus,
        .form-row select:focus,
        .form-row textarea:focus {

            border-color:
                #62d800;

            box-shadow:
                0 0 10px
                rgba(80,255,0,0.08);
        }

        .form-row input::placeholder,
        .form-row textarea::placeholder {

            color: #c0c9d5;
        }

        .form-row select {

            cursor: pointer;
        }

        .form-row select option {

            background: #071b32;

            color: white;
        }

        .form-row textarea {

            min-height: 90px;

            resize: vertical;
        }


        /* =========================================
           FILE INPUT
        ========================================== */

        .file-input {

            padding: 8px !important;

            cursor: pointer;
        }


        /* =========================================
           SUBMIT BUTTON
        ========================================== */

        .submit-btn {

            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #18b900,
                    #54df00
                );

            color: white;

            font-family: inherit;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 20px
                rgba(40,255,0,0.12);
        }

        .submit-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(40,255,0,0.20);
        }


        /* =========================================
           RIGHT SIDE
        ========================================== */

        .right-side {

            min-height: 650px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            position: relative;
        }


        /* =========================================
           PHONE REPAIR VISUAL
        ========================================== */

        .repair-visual {

            width: 350px;

            height: 390px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* glowing circles */

        .glow-circle {

            position: absolute;

            border-radius: 50%;

            border: 2px solid
                rgba(80, 255, 100, 0.45);

            width: 330px;

            height: 330px;

            box-shadow:
                0 0 25px
                rgba(0, 180, 255, 0.15);
        }

        .glow-circle::before {

            content: "";

            position: absolute;

            inset: 22px;

            border-radius: 50%;

            border: 2px solid
                rgba(0, 180, 255, 0.45);
        }

        .glow-circle::after {

            content: "";

            position: absolute;

            inset: 55px;

            border-radius: 50%;

            border: 2px solid
                rgba(180, 50, 255, 0.35);
        }


        /* =========================================
           PHONE
        ========================================== */

        .phone {

            width: 175px;

            height: 315px;

            background:
                linear-gradient(
                    145deg,
                    #07111c,
                    #02070d
                );

            border:
                5px solid
                #151f2a;

            border-radius: 30px;

            position: relative;

            z-index: 5;

            box-shadow:
                0 0 25px
                rgba(0,0,0,0.8),

                inset 0 0 15px
                rgba(0,150,255,0.12);
        }

        .phone::before {

            content: "";

            position: absolute;

            width: 58px;

            height: 8px;

            border-radius: 10px;

            background: #03070b;

            top: 10px;

            left: 50%;

            transform:
                translateX(-50%);
        }

        .phone::after {

            content: "";

            position: absolute;

            width: 34px;

            height: 34px;

            border:
                2px solid
                #26313d;

            border-radius: 50%;

            bottom: 8px;

            left: 50%;

            transform:
                translateX(-50%);
        }


        /* =========================================
           PHONE ICON
        ========================================== */

        .phone-icon {

            position: absolute;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            font-size: 90px;

            color: #f3f5f7;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(255,255,255,0.25)
                );
        }


        /* =========================================
           TOOLS
        ========================================== */

        .tools {

            position: absolute;

            z-index: 6;

            font-size: 90px;

            color: #e9edf0;

            transform:
                rotate(-20deg);

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(255,255,255,0.20)
                );
        }


        /* =========================================
           PLATFORM
        ========================================== */

        .platform {

            position: absolute;

            bottom: 20px;

            width: 360px;

            height: 55px;

            border-radius: 50%;

            border:
                3px solid
                rgba(0, 180, 255, 0.55);

            box-shadow:
                0 0 20px
                rgba(0,150,255,0.25);

            z-index: 2;
        }

        .platform::before {

            content: "";

            position: absolute;

            inset: 9px;

            border-radius: 50%;

            border:
                2px solid
                rgba(0, 190, 255, 0.25);
        }


        /* =========================================
           WHY CHOOSE US
        ========================================== */

        .why-us {

            width: 100%;

            max-width: 430px;

            margin-top: 10px;

            padding: 25px 30px;

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    rgba(4, 27, 57, 0.97),
                    rgba(1, 14, 33, 0.98)
                );

            border:
                1px solid
                rgba(0, 130, 220, 0.25);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.30);
        }

        .why-us h2 {

            font-size: 24px;

            margin-bottom: 12px;
        }

        .why-item {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 8px 0;

            color: #f1f4f7;

            font-size: 15px;
        }

        .why-item i {

            color: #64ee00;

            font-size: 17px;
        }


        /* =========================================
           SERVICE INFO
        ========================================== */

        .selected-service {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 22px;

            padding:
                8px 15px;

            border-radius: 8px;

            background:
                rgba(62, 180, 0, 0.12);

            border:
                1px solid
                rgba(100, 255, 0, 0.30);

            color: #a9ff72;

            font-size: 14px;

            font-weight: 600;
        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 1000px) {

            .nav-links {

                gap: 20px;

                margin-left: 20px;
            }

            .booking-layout {

                grid-template-columns: 1fr;

            }

            .right-side {

                min-height: auto;

                margin-top: 20px;
            }

        }


        @media (max-width: 800px) {

            header {

                height: 75px;
            }

            .logo {

                width: 90px;
                height: 90px;

                top: 10px;
            }

            .nav-links {

                display: none;

                position: absolute;

                top: 75px;

                left: 0;

                width: 100%;

                margin: 0;

                padding: 25px;

                flex-direction: column;

                gap: 20px;

                background: #020d20;

                border-bottom:
                    1px solid
                    #2aa900;
            }

            .nav-links.show {

                display: flex;
            }

            .nav-links a.active::after {

                display: none;
            }

            .admin-btn {

                display: none;
            }

            .menu-btn {

                display: block;
            }

            .booking-section {

                padding-top: 105px;
            }

        }


        @media (max-width: 600px) {

            .booking-section {

                width: 90%;
            }

            .booking-title h1 {

                font-size: 34px;
            }

            .booking-title p {

                font-size: 14px;
            }

            .form-row {

                grid-template-columns: 1fr;

                gap: 6px;

                border-bottom: none;

                margin-bottom: 15px;
            }

            .form-row label {

                font-size: 14px;
            }

            .repair-visual {

                width: 300px;

                height: 350px;
            }

            .glow-circle {

                width: 270px;
                height: 270px;
            }

            .phone {

                width: 145px;

                height: 270px;
            }

            .phone-icon {

                font-size: 70px;
            }

            .tools {

                font-size: 70px;
            }

            .platform {

                width: 290px;
            }

            .why-us {

                padding: 20px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     NAVBAR
========================================== -->

<header>

    <div class="navbar">


        <!-- LOGO -->

        <a
            href="index.html"
            class="logo"
        >

            <img
                src="vjmobiles.png"
                alt="VJ Mobiles Logo"
            >

        </a>


        <!-- NAVIGATION -->

        <nav
            class="nav-links"
            id="navLinks"
        >

            <a href="index.html">
                Home
            </a>

            <a
                href="services.html"
                class="active"
            >
                Services
            </a>

            <a href="accessories.html">
                Accessories
            </a>

            <a href="track-order.html">
                Track Order
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="about.html">
                About Us
            </a>

        </nav>


        <!-- ADMIN -->

        <button
            class="admin-btn"
            onclick="adminLogin()"
        >

            <i class="fa-regular fa-user"></i>

            &nbsp;

            Admin Login

        </button>


        <!-- MOBILE MENU -->

        <div
            class="menu-btn"
            onclick="toggleMenu()"
        >

            <i class="fa-solid fa-bars"></i>

        </div>

    </div>

</header>



<!-- =========================================
     BOOKING SECTION
========================================== -->

<main class="booking-section">


    <!-- TITLE -->

    <div class="booking-title">

        <h1>
            BOOK SERVICE
        </h1>

        <p>
            Fill in the details below
        </p>

    </div>


    <!-- =====================================
         LAYOUT
    ====================================== -->

    <div class="booking-layout">


        <!-- =================================
             LEFT FORM
        ================================== -->

        <div class="booking-form">


            <!-- SELECTED SERVICE -->

            <div
                class="selected-service"
                id="selectedService"
            >

                <i class="fa-solid fa-screwdriver-wrench"></i>

                Selected Service: Loading...

            </div>


            <!-- FULL NAME -->

            <div class="form-row">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- MOBILE NUMBER -->

            <div class="form-row">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobileNumber"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-row">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required
                >

            </div>


            <!-- ADDRESS -->

            <div class="form-row">

                <label>
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Enter your full address"
                    required
                >

            </div>


            <!-- BRAND -->

            <div class="form-row">

                <label>
                    Mobile Brand
                </label>

                <select
                    id="brand"
                    onchange="loadModels()"
                    required
                >

                    <option value="">
                        Select Brand
                    </option>

                    <option value="Apple">
                        Apple
                    </option>

                    <option value="Samsung">
                        Samsung
                    </option>

                    <option value="OnePlus">
                        OnePlus
                    </option>

                    <option value="Xiaomi">
                        Xiaomi
                    </option>

                    <option value="Redmi">
                        Redmi
                    </option>

                    <option value="Realme">
                        Realme
                    </option>

                    <option value="Vivo">
                        Vivo
                    </option>

                    <option value="Oppo">
                        Oppo
                    </option>

                    <option value="Motorola">
                        Motorola
                    </option>

                    <option value="Nothing">
                        Nothing
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- MODEL -->

            <div class="form-row">

                <label>
                    Mobile Model
                </label>

                <select
                    id="model"
                    required
                >

                    <option value="">
                        Select Model
                    </option>

                </select>

            </div>


            <!-- SERVICE TYPE -->

            <div class="form-row">

                <label>
                    Service Type
                </label>

                <select
                    id="serviceType"
                    required
                >

                    <option value="">
                        Select Service
                    </option>

                    <option value="Doorstep Service">
                        Doorstep Service
                    </option>

                    <option value="Shop Service">
                        Shop Service
                    </option>

                </select>

            </div>


            <!-- PROBLEM DESCRIPTION -->

            <div class="form-row">

                <label>
                    Problem Description
                </label>

                <textarea
                    id="problemDescription"
                    placeholder="Describe the problem"
                    required
                ></textarea>

            </div>


            <!-- DATE -->

            <div class="form-row">

                <label>
                    Preferred Date
                </label>

                <input
                    type="date"
                    id="preferredDate"
                    required
                >

            </div>


            <!-- IMAGE -->

            <div class="form-row">

                <label>
                    Upload Image (Optional)
                </label>

                <input
                    type="file"
                    id="problemImage"
                    class="file-input"
                    accept="image/*"
                >

            </div>


            <!-- SUBMIT -->

            <button
                class="submit-btn"
                onclick="submitRequest()"
            >

                SUBMIT REQUEST

            </button>

        </div>



        <!-- =================================
             RIGHT SIDE
        ================================== -->

        <div class="right-side">


            <!-- REPAIR VISUAL -->

            <div class="repair-visual">


                <div class="glow-circle"></div>


                <div class="phone">

                    <i
                        class="fa-solid fa-screwdriver-wrench phone-icon"
                    ></i>

                </div>


                <div class="tools">

                    <i
                        class="fa-solid fa-wrench"
                    ></i>

                </div>


                <div class="platform"></div>

            </div>



            <!-- WHY CHOOSE US -->

            <div class="why-us">

                <h2>
                    WHY CHOOSE US?
                </h2>


                <div class="why-item">

                    <i
                        class="fa-solid fa-circle-check"
                    ></i>

                    Expert Technicians

                </div>


                <div class="why-item">

                    <i
                        class="fa-solid fa-circle-check"
                    ></i>

                    Genuine Spare Parts

                </div>


                <div class="why-item">

                    <i
                        class="fa-solid fa-circle-check"
                    ></i>

                    Quick Service

                </div>


                <div class="why-item">

                    <i
                        class="fa-solid fa-circle-check"
                    ></i>

                    Doorstep Support

                </div>


                <div class="why-item">

                    <i
                        class="fa-solid fa-circle-check"
                    ></i>

                    Affordable Prices

                </div>

            </div>

        </div>

    </div>

</main>



<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* =========================================
       MOBILE MENU
    ========================================== */
    window.toggleMenu = function () {
        document.getElementById("navLinks").classList.toggle("show");
    };

    window.adminLogin = function () {
        window.location.href = "adminlogin.html";
    };


    /* =========================================
       GET SELECTED SERVICE FROM URL
    ========================================== */
    const params          = new URLSearchParams(window.location.search);
    const selectedService = params.get("service");

    if (selectedService) {
        document.getElementById("selectedService").innerHTML =
            '<i class="fa-solid fa-screwdriver-wrench"></i> Selected Service: ' + selectedService;
    } else {
        document.getElementById("selectedService").innerHTML =
            '<i class="fa-solid fa-screwdriver-wrench"></i> Selected Service: General Service';
    }


    /* =========================================
       MOBILE MODELS (static lookup)
    ========================================== */
    const models = {
        Apple:    ["iPhone 11","iPhone 11 Pro","iPhone 11 Pro Max","iPhone SE (2nd generation)","iPhone 12 mini","iPhone 12","iPhone 12 Pro","iPhone 12 Pro Max","iPhone 13 mini","iPhone 13","iPhone 13 Pro","iPhone 13 Pro Max","iPhone SE (3rd generation)","iPhone 14","iPhone 14 Plus","iPhone 14 Pro","iPhone 14 Pro Max","iPhone 15","iPhone 15 Plus","iPhone 15 Pro","iPhone 15 Pro Max","iPhone 16","iPhone 16 Plus","iPhone 16 Pro","iPhone 16 Pro Max","iPhone 16e","iPhone 17","iPhone 17 Pro","iPhone 17 Pro Max","iPhone Air","iPhone 17e"],
        Samsung:  ["Galaxy S7","Galaxy S7 Edge","Galaxy Note 7","Galaxy A3 (2016)","Galaxy A5 (2016)","Galaxy A7 (2016)","Galaxy J2 / J5 / J7"],
        OnePlus:  ["OnePlus 12","OnePlus 11","OnePlus Nord 4","OnePlus Nord CE 4"],
        Xiaomi:   ["Xiaomi 14","Xiaomi 13","Xiaomi 12"],
        Redmi:    ["Redmi Note 13","Redmi Note 12","Redmi 13C","Redmi 12"],
        Realme:   ["Realme GT 6","Realme 12 Pro","Realme 11 Pro","Realme Narzo"],
        Vivo:     ["Vivo V30","Vivo V29","Vivo Y200","Vivo Y100"],
        Oppo:     ["Oppo Reno 12","Oppo Reno 11","Oppo F25","Oppo A79"],
        Motorola: ["Motorola Edge 50","Motorola Edge 40","Moto G85","Moto G84"],
        Nothing:  ["Nothing Phone 2","Nothing Phone 2a","Nothing Phone 1"],
        Other:    ["Other Model"]
    };

    window.loadModels = function () {
        const brand       = document.getElementById("brand").value;
        const modelSelect = document.getElementById("model");
        modelSelect.innerHTML = '<option value="">Select Model</option>';
        if (models[brand]) {
            models[brand].forEach(function (m) {
                const opt   = document.createElement("option");
                opt.value   = m;
                opt.textContent = m;
                modelSelect.appendChild(opt);
            });
        }
    };


    /* =========================================
       SET MINIMUM DATE
    ========================================== */
    document.getElementById("preferredDate")
        .setAttribute("min", new Date().toISOString().split("T")[0]);


    /* =========================================
       SUBMIT SERVICE REQUEST â†’ SUPABASE
    ========================================== */
    window.submitRequest = async function () {

        const name        = document.getElementById("fullName").value.trim();
        const phone       = document.getElementById("mobileNumber").value.trim();
        const email       = document.getElementById("email").value.trim();
        const address     = document.getElementById("address").value.trim();
        const brand       = document.getElementById("brand").value;
        const model       = document.getElementById("model").value;
        const serviceType = document.getElementById("serviceType").value;
        const problem     = document.getElementById("problemDescription").value.trim();
        const date        = document.getElementById("preferredDate").value;
        const imageFile   = document.getElementById("problemImage").files[0];

        /* VALIDATION */
        if (!name || !phone || !email || !address || !brand || !model || !serviceType || !problem || !date) {
            alert("Please fill all the required details.");
            return;
        }
        if (!/^[0-9]{10}$/.test(phone)) {
            alert("Please enter a valid 10-digit mobile number.");
            return;
        }

        const btn = document.querySelector(".submit-btn");
        btn.textContent = "Submittingâ€¦";
        btn.disabled    = true;

        /* UPLOAD IMAGE if provided */
        let imageUrl = null;
        if (imageFile) {
            const ext      = imageFile.name.split(".").pop();
            const filePath = `problem-images/service-${Date.now()}.${ext}`;
            const { error: upErr } = await supabase.storage
                .from("vj-mobiles")
                .upload(filePath, imageFile, { upsert: false });
            if (!upErr) {
                const { data: urlData } = supabase.storage
                    .from("vj-mobiles").getPublicUrl(filePath);
                imageUrl = urlData.publicUrl;
            }
        }

        /* LOOK UP brand_id and model_id */
        let brandId = null;
        let modelId = null;

        // Get brand
        const { data: brandRow } = await supabase
            .from("brands")
            .select("id")
            .eq("brand_name", brand)
            .single();
        brandId = brandRow?.id || null;

        if (brandId) {
            // Try to find model in DB
            const { data: modelRow } = await supabase
                .from("mobile_models")
                .select("id")
                .eq("model_name", model)
                .eq("brand_id", brandId)
                .maybeSingle();   // maybeSingle — no error if not found

            modelId = modelRow?.id || null;

            // If model not found, try to insert it
            if (!modelId) {
                const { data: newModel } = await supabase
                    .from("mobile_models")
                    .insert({ brand_id: brandId, model_name: model, is_active: true })
                    .select("id")
                    .maybeSingle();
                modelId = newModel?.id || null;
            }
        }

        /* LOOK UP service_type_id — fallback to first available */
        let svcId = 1;
        const svcQuery = selectedService
            ? await supabase.from("service_types").select("id").ilike("service_name", "%" + selectedService + "%").maybeSingle()
            : await supabase.from("service_types").select("id").limit(1).maybeSingle();
        if (svcQuery.data?.id) svcId = svcQuery.data.id;

        /* GET current user (optional) */
        const { data: { user } } = await supabase.auth.getUser();

        /* INSERT BOOKING */
        const { data: booking, error } = await supabase
            .from("service_bookings")
            .insert({
                customer_id:       user?.id || null,
                customer_name:     name,
                mobile_number:     phone,
                email:             email,
                address:           address,
                brand_id:          brandId,
                model_id:          modelId,
                service_type_id:   svcId,
                service_mode:      serviceType,
                issue_description: problem,
                preferred_date:    date,
                device_image_url:  imageUrl,
                status:            "Pending",
            })
            .select("booking_number")
            .single();

        btn.textContent = "SUBMIT REQUEST";
        btn.disabled    = false;

        if (error) {
            alert("Error submitting request: " + error.message);
            return;
        }

        alert(
            "Service request submitted successfully!\n\n" +
            "Your Booking Number: " + booking.booking_number + "\n\n" +
            "Save this number to track your service."
        );

        window.location.href = "trackorder.html";
    };

</script>

</body>
